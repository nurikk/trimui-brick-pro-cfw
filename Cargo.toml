[workspace]
members = [
    "crates/domain",
    "crates/platform-contract",
    "crates/host-platform",
    "crates/launcher",
    "crates/storage-layout",
    "crates/bootstrap-probe",
    "crates/brick-recovery",
    "crates/brick-diagnostics",
    "crates/launch-contract",
    "crates/metadata-scraper",
    "crates/launcher-theme",
    "crates/package-trust",
    "crates/package-manager",
    "crates/theme-garden",
    "crates/settings-schema",
    "crates/virtual-keyboard",
    "crates/wifi-manager",
    "crates/wifi-settings-controller",
    "crates/ui-model",
    "crates/media-cache",
    "crates/emulator-catalog",
    "crates/input-profile",
    "crates/session-broker",
    "crates/settings-ui",
    "crates/display-profile",
    "crates/boot-state",
    "crates/update-agent",
    "crates/userspace-supervisor",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
sha2 = "0.10"
hex = "0.4"
jiff = "0.2.31"
signal-hook = "0.3"
png = "0.17"
sdl2 = "0.37"

libc = "0.2"
