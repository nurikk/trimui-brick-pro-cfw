[package]
name = "session-broker"
version = "0.1.0"
edition = "2021"
default-run = "session-broker"

[[bin]]
name = "session-broker"
path = "src/main.rs"

[[bin]]
name = "session-broker-helper"
path = "src/helper.rs"

[dependencies]
launch-contract = { path = "../launch-contract" }
package-manager = { path = "../package-manager" }
libc = "0.2"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sim-platform-contract = { path = "../platform-contract" }
save-vault = { path = "../save-vault" }
save-sync = { path = "../save-sync" }
