[package]
name = "sim-launcher"
version = "0.1.0"
edition = "2021"

[features]
default = ["host", "simulator"]
host = ["dep:signal-hook", "dep:sim-host-platform"]
simulator = []

[dependencies]
anyhow.workspace = true
launch-contract = { path = "../launch-contract" }
compatibility-recipes = { path = "../compatibility-recipes" }
package-trust = { path = "../package-trust" }
session-broker = { path = "../session-broker" }
signal-hook = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
sim-domain = { path = "../domain" }
sim-host-platform = { path = "../host-platform", optional = true }
sim-platform-contract = { path = "../platform-contract" }
png.workspace = true
launcher-presentation = { path = "../launcher-presentation" }
launcher-theme = { path = "../launcher-theme" }
settings-schema = { path = "../settings-schema" }
settings-ui = { path = "../settings-ui" }
ui-model = { path = "../ui-model" }
virtual-keyboard = { path = "../virtual-keyboard" }
wifi-manager = { path = "../wifi-manager" }
wifi-settings-controller = { path = "../wifi-settings-controller" }
metadata-scraper = { path = "../metadata-scraper" }
media-cache = { path = "../media-cache" }

[[bin]]
name = "launcher-presentation-journey"
path = "src/bin/launcher-presentation-journey.rs"

[[bin]]
name = "aarch64-semantic-journey"
path = "src/bin/aarch64-semantic-journey.rs"

[[bin]]
name = "compatibility-recipe-launcher-fixtures"
path = "src/bin/compatibility-recipe-launcher-fixtures.rs"
